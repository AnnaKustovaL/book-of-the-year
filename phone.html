<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Сайт в телефоне</title>
<!-- СЛУЖЕБНАЯ страница для автора: показывает сайт в рамке телефона, пока вы его правите.
     Посетителям не нужна, на сайте на неё нет ссылок. -->
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(circle at 50% 0%, #1b2d52, #0b1a33 70%);
    font: 500 13px/1.3 Montserrat, "Segoe UI", sans-serif; color: #e9eef6;
    display: flex; flex-direction: column; align-items: center; overflow: hidden;
  }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; padding: 12px 16px; }
  .tools select, .tools button {
    height: 34px; padding: 0 14px; border-radius: 17px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.22); color: #eef2f8; font: inherit;
    background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.03) 55%, rgba(0,0,0,.12));
  }
  .tools select option { color: #111; }
  .tools button:hover, .tools select:hover { border-color: #c99a3e; }
  .tools .gold { background: linear-gradient(180deg, #fbe9b0, #e9bf5c 48%, #b9842c); color: #2a1a05; border-color: #c99a3e; }
  .hint { opacity: .6; font-size: 12px; }
  .stage { flex: 1; width: 100%; display: grid; place-items: center; min-height: 0; padding-bottom: 16px; }
  .phone {
    position: relative; padding: 14px; border-radius: 52px; background: #10131a;
    box-shadow: 0 0 0 2px #2c3240, 0 30px 80px rgba(0,0,0,.55);
    position: absolute; top: 0; left: 0; transform-origin: 0 0;
  }
  .box { position: relative; }
  .phone.flat { border-radius: 30px; }
  iframe { display: block; border: 0; border-radius: 40px; background: #fff; }
  .phone.flat iframe { border-radius: 18px; }
</style>
</head>
<body>
  <div class="tools">
    <select id="dev" aria-label="Модель телефона">
      <option value="390x844">iPhone 14 / 15 — 390×844</option>
      <option value="375x667" data-flat>iPhone SE — 375×667</option>
      <option value="430x932">iPhone Pro Max — 430×932</option>
      <option value="360x800">Android (Samsung) — 360×800</option>
      <option value="412x915">Android (Pixel) — 412×915</option>
      <option value="768x1024" data-flat>Планшет iPad — 768×1024</option>
    </select>
    <button id="rot" type="button">Повернуть</button>
    <button id="reload" class="gold" type="button">Обновить ⟳</button>
    <span class="hint">После правки файла нажмите «Обновить» (или клавишу R)</span>
  </div>
  <div class="stage"><div class="box" id="box"><div class="phone" id="phone"><iframe id="view" src="index.html" title="Сайт в телефоне"></iframe></div></div></div>

<script>
(function () {
  var dev = document.getElementById("dev"), phone = document.getElementById("phone"), view = document.getElementById("view");
  var land = false;
  try { var s = localStorage.getItem("phone-preview"); if (s) { s = JSON.parse(s); dev.value = s.dev || dev.value; land = !!s.land; } } catch (e) {}

  function fit() {
    var wh = dev.value.split("x").map(Number), w = wh[0], h = wh[1];
    if (land) { var t = w; w = h; h = t; }
    view.style.width = w + "px"; view.style.height = h + "px";
    phone.classList.toggle("land", land);
    phone.classList.toggle("flat", dev.selectedOptions[0].hasAttribute("data-flat"));
    /* уменьшаем рамку, если телефон не помещается в окно (сам сайт внутри остаётся нужной ширины) */
    var st = document.querySelector(".stage");
    var k = Math.min(1, (st.clientHeight - 16) / (h + 28), (st.clientWidth - 32) / (w + 28));
    phone.style.transform = "scale(" + k + ")";
    var box = document.getElementById("box"); box.style.width = (w + 28) * k + "px"; box.style.height = (h + 28) * k + "px";
    try { localStorage.setItem("phone-preview", JSON.stringify({ dev: dev.value, land: land })); } catch (e) {}
  }
  function reload() { var src = view.getAttribute("src").split("?")[0]; view.src = src + "?t=" + Date.now(); }

  dev.addEventListener("change", fit);
  document.getElementById("rot").addEventListener("click", function () { land = !land; fit(); });
  document.getElementById("reload").addEventListener("click", reload);
  document.addEventListener("keydown", function (e) { if ((e.key === "r" || e.key === "к") && !e.ctrlKey && !e.metaKey && e.target === document.body) reload(); });
  addEventListener("resize", fit);
  fit();
})();
</script>
</body>
</html>
